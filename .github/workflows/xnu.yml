
name: xnu

on:
  workflow_dispatch:
    inputs:
      macos_version:
        description: macOS release whose XNU to build (13.5 = xnu-8796)
        default: "13.5"
      kernel_config:
        description: RELEASE / DEVELOPMENT / DEBUG
        default: DEVELOPMENT
      machine_config:
        description: xnu MACHINE_CONFIG
        default: SWEET
      keep_going:
        description: make -k (collect all compile errors in one run)
        default: "true"

  push:
    branches: [main, A70]
    paths:
      - "xnu/patches/**"
      - ".github/workflows/xnu.yml"

concurrency:
  group: xnu-${{ github.ref }}
  cancel-in-progress: true

env:
  DXB_REPO: https://github.com/blacktop/darwin-xnu-build
  DXB_SHA: 663906528d1cd5ea8fde7de6f16de73db9511549
  MACOS_VERSION: ${{ inputs.macos_version || '13.5' }}
  KERNEL_CONFIG: ${{ inputs.kernel_config || 'DEVELOPMENT' }}
  MACHINE_CONFIG: ${{ inputs.machine_config || 'SWEET' }}

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 120

    steps:
      - uses: actions/checkout@v4

      - name: Fetch and patch build script
        run: |
          set -euo pipefail

          git init -q dxb
          git -C dxb fetch -q --depth 1 "$DXB_REPO" "$DXB_SHA"
          git -C dxb checkout -q FETCH_HEAD

          cp xnu/patches/*.patch xnu/patches/*.sh dxb/patches/

          python3 - <<'PY'
          from pathlib import Path

          p = Path("dxb/build.sh")
          s = p.read_text()

          # Quiet the normal build output.
          s = s.replace("VERBOSE=YES", "VERBOSE=NO")
          s = s.replace("CONCISE=0", "CONCISE=1")

          # Keep the additional arm64 architecture for SWEET.
          old_arch = 'ARCHS="x86_64 arm64e" VALID_ARCHS="x86_64 arm64e"'
          new_arch = 'ARCHS="x86_64 arm64e arm64" VALID_ARCHS="x86_64 arm64e arm64"'

          if old_arch not in s:
              raise SystemExit("ERROR: libfirehose architecture line not found")

          s = s.replace(old_arch, new_arch, 1)

          # Fix libfirehose C11 atomic header integration.
          needle = '''        sed -i '' 's|$(SDKROOT)/usr/local/include|$(FAKEROOT_DIR)/usr/local/include|g' "${SRCROOT}/xcodeconfig/libfirehose_kernel.xcconfig"
        cd "${SRCROOT}"
          '''

          replacement = r'''        sed -i '' 's|$(SDKROOT)/usr/local/include|$(FAKEROOT_DIR)/usr/local/include|g' "${SRCROOT}/xcodeconfig/libfirehose_kernel.xcconfig"

        # Make Clang's builtin headers visible despite -nostdinc.
        CLANG_RESOURCE_INCLUDE="$(xcrun --sdk macosx clang -print-resource-dir)/include"

        if [ ! -f "${CLANG_RESOURCE_INCLUDE}/stdatomic.h" ]; then
            error "Clang stdatomic.h not found"
            exit 1
        fi

        sed -i '' "s|^OTHER_CFLAGS = .*|& -isystem ${CLANG_RESOURCE_INCLUDE}|" \
            "${SRCROOT}/xcodeconfig/libfirehose_kernel.xcconfig"

        # firehose_buffer.c uses os_atomic macros backed by C11 atomics.
        # Include the standard atomic declarations before os/atomic_private.h.
        python3 - "${SRCROOT}/src/firehose/firehose_buffer.c" <<'PYATOMIC'
          import sys
          from pathlib import Path

          p = Path(sys.argv[1])
          s = p.read_text()

          anchor = "#include <os/atomic_private.h>"
          include = "#include <stdatomic.h>"

          if include not in s:
              if anchor not in s:
                  raise SystemExit(
                      "ERROR: could not locate os/atomic_private.h in firehose_buffer.c"
                  )

              s = s.replace(anchor, include + "\n" + anchor, 1)
              p.write_text(s)

          print("C11 atomic source compatibility patch applied.")
          PYATOMIC

        grep -F -- "-isystem ${CLANG_RESOURCE_INCLUDE}" \
            "${SRCROOT}/xcodeconfig/libfirehose_kernel.xcconfig"

        cd "${SRCROOT}"
          '''

          if needle not in s:
              raise SystemExit(
                  "ERROR: Could not find the expected libdispatch patch location"
              )

          s = s.replace(needle, replacement, 1)
          p.write_text(s)
          PY

          echo "Build script patched successfully."

          grep -n 'arm64e arm64' dxb/build.sh
          ls dxb/patches

      - name: Suppress compiler warnings
        shell: bash
        run: |
          set -euo pipefail

          # Do not override OTHER_CFLAGS.
          # That would replace important target-specific flags.
          sed -i '' \
            -e 's/xcodebuild /xcodebuild -quiet GCC_WARN_INHIBIT_ALL_WARNINGS=YES /g' \
            -e 's/VERBOSE=YES/VERBOSE=NO/g' \
            -e 's/CONCISE=0/CONCISE=1/g' \
            dxb/build.sh

          echo "Configured quiet Xcode builds."

          grep -n 'xcodebuild -quiet' dxb/build.sh

      - name: Deps
        run: |
          set -euo pipefail

          brew install jq gum bash cmake ninja

          printf '#!/bin/sh\nexit 0\n' | sudo tee /usr/local/bin/xcodes >/dev/null
          sudo chmod +x /usr/local/bin/xcodes

          sw_vers
          ls -d /Applications/Xcode*.app

          XC=$(ls -d /Applications/Xcode_*.app | sort -V | head -1)

          echo "DEVELOPER_DIR=$XC/Contents/Developer" >> "$GITHUB_ENV"

          sudo xcode-select -s "$XC"

          xcodebuild -version
          xcrun --find iig

          echo "=== Clang resource headers ==="
          RESOURCE_DIR=$(xcrun --sdk macosx clang -print-resource-dir)
          test -f "$RESOURCE_DIR/include/stdatomic.h"
          echo "$RESOURCE_DIR/include/stdatomic.h"

          echo "=== C11 atomic sanity test ==="
          cat > /tmp/atomic_test.c <<'EOF'
          #include <stdatomic.h>

          atomic_int value;

          void test(void) {
              atomic_store_explicit(&value, 1, memory_order_relaxed);
          }
          EOF

          xcrun clang \
            -std=gnu11 \
            -nostdinc \
            -isystem "$RESOURCE_DIR/include" \
            -fsyntax-only /tmp/atomic_test.c

          echo "C11 atomics: OK"

      - name: Build
        working-directory: dxb
        env:
          MAKEFLAGS: ${{ inputs.keep_going == 'false' && '-s' || '-ks' }}
          NINJA_STATUS: ""
        run: |
          bash build.sh

      - name: Package build tree for local compiles
        if: always()
        run: |
          SDK=$(xcrun --sdk macosx --show-sdk-path)

          mkdir -p sdk-kernel-platform

          cp -R "$SDK/System/Library/Frameworks/Kernel.framework/Versions/A/PrivateHeaders/platform" sdk-kernel-platform/ || true

          tar czf buildtree.tgz \
            --exclude='*.o' \
            --exclude='*.cpo' \
            --exclude='*.a' \
            --exclude='*.dSYM' \
            --exclude='*.unstripped' \
            --exclude='kernel.development.*' \
            --exclude='.git' \
            -C dxb build/xnu.obj fakeroot/usr/local/include xnu \
            -C .. sdk-kernel-platform

          ls -la buildtree.tgz

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: xnu-buildtree
          path: buildtree.tgz
          retention-days: 7

      - name: Inspect closed KDK support libs
        if: always()
        run: |
          mkdir -p out/kdk-libs

          for lib in /Library/Developer/KDKs/*/System/Library/KernelSupport/lib*.a; do
            b=$(basename "$lib" .a)
            ar t "$lib" > "out/kdk-libs/$b.members.txt" 2>&1 || true
            nm -m "$lib" > "out/kdk-libs/$b.nm.txt" 2>&1 || true
            lipo -info "$lib" >> out/kdk-libs/arch.txt 2>&1 || true
          done

          ls -la out/kdk-libs

      - name: Collect
        if: always()
        run: |
          mkdir -p out

          cp -R dxb/fakeroot/System/Library/Kernels/. out/ 2>/dev/null || true

          ls -la out

          (cd out && shasum -a 256 kernel.* > SHA256SUMS) || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: xnu-kernel
          path: out/
          if-no-files-found: warn
