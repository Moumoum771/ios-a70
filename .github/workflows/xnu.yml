
name: xnu

on:
  workflow_dispatch:
    inputs:
      macos_version:
        description: macOS release whose XNU to build (13.5 = xnu-8796, iOS 16 era)
        default: "13.5"
      kernel_config:
        description: RELEASE / DEVELOPMENT / DEBUG
        default: DEVELOPMENT
      machine_config:
        description: xnu MACHINE_CONFIG
        default: SWEET
      keep_going:
        description: make -k (collect all compile errors in one run)
        default: "true"

  push:
    branches: [main, A70]
    paths:
      - "xnu/patches/**"
      - ".github/workflows/xnu.yml"

concurrency:
  group: xnu-${{ github.ref }}
  cancel-in-progress: true

env:
  DXB_REPO: https://github.com/blacktop/darwin-xnu-build
  DXB_SHA: 663906528d1cd5ea8fde7de6f16de73db9511549
  MACOS_VERSION: ${{ inputs.macos_version || '13.5' }}
  KERNEL_CONFIG: ${{ inputs.kernel_config || 'DEVELOPMENT' }}
  MACHINE_CONFIG: ${{ inputs.machine_config || 'SWEET' }}

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 120

    steps:
      - uses: actions/checkout@v4

      # ---------------------------------------------------------
      # Fetch and patch darwin-xnu-build
      # ---------------------------------------------------------

      - name: Fetch and patch build script
        shell: bash
        run: |
          set -euo pipefail

          git init -q dxb
          git -C dxb fetch -q --depth 1 "$DXB_REPO" "$DXB_SHA"
          git -C dxb checkout -q FETCH_HEAD

          cp xnu/patches/*.patch xnu/patches/*.sh dxb/patches/

          python3 - <<'PY'
          from pathlib import Path

          p = Path("dxb/build.sh")
          s = p.read_text()

          # Reduce normal build output.
          s = s.replace("VERBOSE=YES", "VERBOSE=NO")
          s = s.replace("CONCISE=0", "CONCISE=1")

          # Add plain arm64 to libfirehose_kernel for SWEET.
          old_arch = 'ARCHS="x86_64 arm64e" VALID_ARCHS="x86_64 arm64e"'
          new_arch = 'ARCHS="x86_64 arm64e arm64" VALID_ARCHS="x86_64 arm64e arm64"'

          if old_arch not in s:
              raise SystemExit(
                  "ERROR: libfirehose architecture declaration not found"
              )

          s = s.replace(old_arch, new_arch, 1)

          # Locate the existing fakeroot include-path configuration.
          lines = s.splitlines(keepends=True)

          anchor = (
              's|$(SDKROOT)/usr/local/include|'
              '$(FAKEROOT_DIR)/usr/local/include|g'
          )

          matches = [
              i for i, line in enumerate(lines)
              if anchor in line
              and "libfirehose_kernel.xcconfig" in line
          ]

          if len(matches) != 1:
              raise SystemExit(
                  "ERROR: Expected exactly one libfirehose include-path "
                  f"command, found {len(matches)}"
              )

          index = matches[0]
          original = lines[index]

          indent = original[:len(original) - len(original.lstrip())]

          # Add C11 atomic support to libfirehose_kernel.
          # This runs when build.sh configures the libfirehose target.
          injected = [
              indent + "\n",
              indent + "# C11 atomic compatibility for modern Clang.\n",
              indent + 'CLANG_RESOURCE_INCLUDE="$(xcrun --sdk macosx clang -print-resource-dir)/include"\n',
              indent + 'ATOMIC_XCCONFIG="${SRCROOT}/xcodeconfig/libfirehose_kernel.xcconfig"\n',
              indent + 'if [ ! -f "${CLANG_RESOURCE_INCLUDE}/stdatomic.h" ]; then\n',
              indent + '    echo "ERROR: Clang stdatomic.h not found" >&2\n',
              indent + '    exit 1\n',
              indent + "fi\n",
              indent + 'if grep -q "^OTHER_CFLAGS = " "${ATOMIC_XCCONFIG}"; then\n',
              indent + '    sed -i \'\' "s|^OTHER_CFLAGS = .*|& -isystem ${CLANG_RESOURCE_INCLUDE} -include stdatomic.h|" "${ATOMIC_XCCONFIG}"\n',
              indent + "else\n",
              indent + '    printf \'\\nOTHER_CFLAGS = -isystem %s -include stdatomic.h\\n\' "${CLANG_RESOURCE_INCLUDE}" >> "${ATOMIC_XCCONFIG}"\n',
              indent + "fi\n",
              indent + 'echo "Configured C11 atomics: ${CLANG_RESOURCE_INCLUDE}"\n',
          ]

          lines[index + 1:index + 1] = injected

          p.write_text("".join(lines))

          print("Build script modifications applied successfully.")
          PY

          echo "=== Architecture modification ==="
          grep -n 'arm64e arm64' dxb/build.sh

          echo "=== Atomic compatibility modification ==="
          grep -n 'CLANG_RESOURCE_INCLUDE' dxb/build.sh

          echo "=== Available patches ==="
          ls dxb/patches

      # ---------------------------------------------------------
      # Quiet compiler output
      # ---------------------------------------------------------

      - name: Suppress compiler warnings
        shell: bash
        run: |
          set -euo pipefail

          # -quiet suppresses normal Xcode build output.
          # Preserve target-specific compiler flags.
          sed -i '' \
            -e 's/xcodebuild /xcodebuild -quiet GCC_WARN_INHIBIT_ALL_WARNINGS=YES /g' \
            -e 's/VERBOSE=YES/VERBOSE=NO/g' \
            -e 's/CONCISE=0/CONCISE=1/g' \
            dxb/build.sh

          echo "Configured quiet Xcode builds."

          grep -n 'xcodebuild -quiet' dxb/build.sh

      # ---------------------------------------------------------
      # Dependencies and Xcode
      # ---------------------------------------------------------

      - name: Dependencies and toolchain
        shell: bash
        run: |
          set -euo pipefail

          brew install jq gum bash cmake ninja

          # build.sh checks for xcodes even though Xcode is preinstalled.
          printf '#!/bin/sh\nexit 0\n' | sudo tee /usr/local/bin/xcodes >/dev/null
          sudo chmod +x /usr/local/bin/xcodes

          sw_vers
          ls -d /Applications/Xcode*.app

          XC=$(ls -d /Applications/Xcode_*.app | sort -V | head -1)

          echo "DEVELOPER_DIR=$XC/Contents/Developer" >> "$GITHUB_ENV"

          sudo xcode-select -s "$XC"

          xcodebuild -version
          xcrun --find iig

          # Verify Clang atomic headers.
          echo "=== Clang resource headers ==="

          RESOURCE_DIR=$(xcrun --sdk macosx clang -print-resource-dir)

          test -f "$RESOURCE_DIR/include/stdatomic.h"

          echo "Found: $RESOURCE_DIR/include/stdatomic.h"

          # Verify C11 atomic declarations work with -nostdinc.
          echo "=== C11 atomic sanity test ==="

          cat > /tmp/atomic_test.c <<'EOF'
          #include <stdatomic.h>

          atomic_int value;

          void test(void) {
              atomic_store_explicit(&value, 1, memory_order_relaxed);
          }
          EOF

          xcrun clang \
            -std=gnu11 \
            -nostdinc \
            -isystem "$RESOURCE_DIR/include" \
            -fsyntax-only /tmp/atomic_test.c

          echo "C11 atomics: OK"

      # ---------------------------------------------------------
      # Build XNU
      # ---------------------------------------------------------

      - name: Build XNU
        working-directory: dxb
        env:
          MAKEFLAGS: ${{ inputs.keep_going == 'false' && '-s' || '-ks' }}
          NINJA_STATUS: ""
        run: |
          bash build.sh

      # ---------------------------------------------------------
      # Package build tree for local compilation
      # ---------------------------------------------------------

      - name: Package build tree for local compiles
        if: always()
        shell: bash
        run: |
          SDK=$(xcrun --sdk macosx --show-sdk-path)

          mkdir -p sdk-kernel-platform

          cp -R \
            "$SDK/System/Library/Frameworks/Kernel.framework/Versions/A/PrivateHeaders/platform" \
            sdk-kernel-platform/ || true

          tar czf buildtree.tgz \
            --exclude='*.o' \
            --exclude='*.cpo' \
            --exclude='*.a' \
            --exclude='*.dSYM' \
            --exclude='*.unstripped' \
            --exclude='kernel.development.*' \
            --exclude='.git' \
            -C dxb build/xnu.obj fakeroot/usr/local/include xnu \
            -C .. sdk-kernel-platform

          ls -lh buildtree.tgz

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: xnu-buildtree
          path: buildtree.tgz
          retention-days: 7

      # ---------------------------------------------------------
      # Inspect closed KDK support libraries
      # ---------------------------------------------------------

      - name: Inspect closed KDK support libraries
        if: always()
        shell: bash
        run: |
          mkdir -p out/kdk-libs

          FOUND=0

          for lib in /Library/Developer/KDKs/*/System/Library/KernelSupport/lib*.a; do
            [ -f "$lib" ] || continue

            FOUND=1

            b=$(basename "$lib" .a)

            echo "Inspecting $lib"

            ar t "$lib" \
              > "out/kdk-libs/$b.members.txt" 2>&1 || true

            nm -m "$lib" \
              > "out/kdk-libs/$b.nm.txt" 2>&1 || true

            lipo -info "$lib" \
              >> out/kdk-libs/arch.txt 2>&1 || true
          done

          if [ "$FOUND" -eq 0 ]; then
            echo "No installed KDK support libraries found."
          fi

          ls -la out/kdk-libs

      # ---------------------------------------------------------
      # Collect kernel artifacts
      # ---------------------------------------------------------

      - name: Collect kernel
        if: always()
        shell: bash
        run: |
          mkdir -p out

          cp -R dxb/fakeroot/System/Library/Kernels/. out/ 2>/dev/null || true

          echo "=== Collected kernel files ==="
          ls -lah out

          (cd out && shasum -a 256 kernel.* > SHA256SUMS) || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: xnu-kernel
          path: out/
          if-no-files-found: warn
