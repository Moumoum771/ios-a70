
name: xnu

on:
  workflow_dispatch:
    inputs:
      macos_version:
        description: macOS release whose XNU to build (13.5 = xnu-8796, iOS 16 era)
        default: "13.5"
      kernel_config:
        description: RELEASE / DEVELOPMENT / DEBUG
        default: DEVELOPMENT
      machine_config:
        description: xnu MACHINE_CONFIG
        default: SWEET
      keep_going:
        description: make -k (collect all compile errors in one run)
        default: "true"

  push:
    branches: [main, A70]
    paths:
      - "xnu/patches/**"
      - ".github/workflows/xnu.yml"

concurrency:
  group: xnu-${{ github.ref }}
  cancel-in-progress: true

env:
  DXB_REPO: https://github.com/blacktop/darwin-xnu-build
  DXB_SHA: 663906528d1cd5ea8fde7de6f16de73db9511549
  MACOS_VERSION: ${{ inputs.macos_version || '13.5' }}
  KERNEL_CONFIG: ${{ inputs.kernel_config || 'DEVELOPMENT' }}
  MACHINE_CONFIG: ${{ inputs.machine_config || 'SWEET' }}

jobs:
  build:
    # Xcode 15 is compatible with the XNU 8796 IORPC definitions.
    runs-on: macos-14
    timeout-minutes: 120

    steps:
      - uses: actions/checkout@v4

      - name: Fetch and patch build script
        shell: bash
        run: |
          set -euo pipefail

          git init -q dxb
          git -C dxb fetch -q --depth 1 "$DXB_REPO" "$DXB_SHA"
          git -C dxb checkout -q FETCH_HEAD

          cp xnu/patches/*.patch xnu/patches/*.sh dxb/patches/

          python3 - <<'PY'
          from pathlib import Path

          p = Path("dxb/build.sh")
          s = p.read_text()

          # Reduce normal build output.
          s = s.replace("VERBOSE=YES", "VERBOSE=NO")
          s = s.replace("CONCISE=0", "CONCISE=1")

          # Add plain arm64 to libfirehose_kernel for the SWEET kernel.
          old_arch = 'ARCHS="x86_64 arm64e" VALID_ARCHS="x86_64 arm64e"'
          new_arch = 'ARCHS="x86_64 arm64e arm64" VALID_ARCHS="x86_64 arm64e arm64"'

          if old_arch not in s:
              raise SystemExit("ERROR: libfirehose architecture declaration not found")

          s = s.replace(old_arch, new_arch, 1)

          # Add the C11 atomic compatibility fix inside build_libdispatch().
          needle = """        sed -i '' 's|$(SDKROOT)/System/Library/Frameworks/Kernel.framework/PrivateHeaders|$(FAKEROOT_DIR)/System/Library/Frameworks/Kernel.framework/PrivateHeaders|g' "${SRCROOT}/xcodeconfig/libfirehose_kernel.xcconfig"
                  """

          # Use the actual source line as the insertion anchor.
          anchor = """        sed -i '' 's|$(SDKROOT)/usr/local/include|$(FAKEROOT_DIR)/usr/local/include|g' "${SRCROOT}/xcodeconfig/libfirehose_kernel.xcconfig"
        cd "${SRCROOT}"
          """

          if anchor not in s:
              raise SystemExit(
                  "ERROR: Could not find the libdispatch header configuration block"
              )

          replacement = """        sed -i '' 's|$(SDKROOT)/usr/local/include|$(FAKEROOT_DIR)/usr/local/include|g' "${SRCROOT}/xcodeconfig/libfirehose_kernel.xcconfig"

        # Expose Clang builtin headers despite -nostdinc.
        CLANG_RESOURCE_INCLUDE="$(xcrun --sdk macosx clang -print-resource-dir)/include"

        if [ ! -f "${CLANG_RESOURCE_INCLUDE}/stdatomic.h" ]; then
            error "Clang stdatomic.h not found"
            exit 1
        fi

        # Verify that the target has an OTHER_CFLAGS declaration.
        if ! grep -q '^OTHER_CFLAGS = ' "${SRCROOT}/xcodeconfig/libfirehose_kernel.xcconfig"; then
            error "OTHER_CFLAGS declaration not found in libfirehose_kernel.xcconfig"
            exit 1
        fi

        # Preserve existing kernel flags and expose C11 atomics.
        sed -i '' "s|^OTHER_CFLAGS = .*|& -isystem ${CLANG_RESOURCE_INCLUDE} -include stdatomic.h|" \\
            "${SRCROOT}/xcodeconfig/libfirehose_kernel.xcconfig"

        cd "${SRCROOT}"
          """

          s = s.replace(anchor, replacement, 1)

          p.write_text(s)

          print("Build script modifications applied.")
          PY

          # Verify modifications.
          grep -n 'arm64e arm64' dxb/build.sh
          grep -n 'CLANG_RESOURCE_INCLUDE' dxb/build.sh
          grep -n 'include stdatomic.h' dxb/build.sh

          ls dxb/patches

      - name: Suppress compiler warnings
        shell: bash
        run: |
          set -euo pipefail

          # -quiet suppresses normal Xcode build output.
          # Do not override OTHER_CFLAGS globally.
          sed -i '' \
            -e 's/xcodebuild /xcodebuild -quiet /g' \
            dxb/build.sh

          echo "Configured quiet Xcode builds."
          grep -n 'xcodebuild -quiet' dxb/build.sh

      - name: Dependencies and toolchain
        shell: bash
        run: |
          set -euo pipefail

          brew install jq gum bash cmake ninja

          # build.sh checks for xcodes even though Xcode is preinstalled.
          printf '#!/bin/sh\nexit 0\n' | sudo tee /usr/local/bin/xcodes >/dev/null
          sudo chmod +x /usr/local/bin/xcodes

          sw_vers
          ls -d /Applications/Xcode*.app

          XC=$(ls -d /Applications/Xcode_*.app | sort -V | head -1)

          echo "DEVELOPER_DIR=$XC/Contents/Developer" >> "$GITHUB_ENV"

          sudo xcode-select -s "$XC"

          xcodebuild -version
          xcrun --find iig

          echo "=== Clang resource headers ==="

          RESOURCE_DIR=$(xcrun --sdk macosx clang -print-resource-dir)

          test -f "$RESOURCE_DIR/include/stdatomic.h"

          echo "Found: $RESOURCE_DIR/include/stdatomic.h"

          echo "=== C11 atomic sanity test ==="

          cat > /tmp/atomic_test.c <<'EOF'
          #include <stdatomic.h>

          atomic_int value;

          void test(void) {
              atomic_store_explicit(&value, 1, memory_order_relaxed);
          }
          EOF

          xcrun clang \
            -std=gnu11 \
            -nostdinc \
            -isystem "$RESOURCE_DIR/include" \
            -fsyntax-only /tmp/atomic_test.c

          echo "C11 atomics: OK"

      - name: Build XNU
        working-directory: dxb
        env:
          MAKEFLAGS: ${{ inputs.keep_going == 'false' && '-s' || '-ks' }}
          NINJA_STATUS: ""
        run: |
          bash build.sh

      - name: Package build tree for local compiles
        if: always()
        shell: bash
        run: |
          SDK=$(xcrun --sdk macosx --show-sdk-path)

          mkdir -p sdk-kernel-platform

          cp -R \
            "$SDK/System/Library/Frameworks/Kernel.framework/Versions/A/PrivateHeaders/platform" \
            sdk-kernel-platform/ || true

          tar czf buildtree.tgz \
            --exclude='*.o' \
            --exclude='*.cpo' \
            --exclude='*.a' \
            --exclude='*.dSYM' \
            --exclude='*.unstripped' \
            --exclude='kernel.development.*' \
            --exclude='.git' \
            -C dxb build/xnu.obj fakeroot/usr/local/include xnu \
            -C .. sdk-kernel-platform

          ls -la buildtree.tgz

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: xnu-buildtree
          path: buildtree.tgz
          retention-days: 7

      - name: Inspect closed KDK support libraries
        if: always()
        shell: bash
        run: |
          mkdir -p out/kdk-libs

          for lib in /Library/Developer/KDKs/*/System/Library/KernelSupport/lib*.a; do
            b=$(basename "$lib" .a)

            ar t "$lib" \
              > "out/kdk-libs/$b.members.txt" 2>&1 || true

            nm -m "$lib" \
              > "out/kdk-libs/$b.nm.txt" 2>&1 || true

            lipo -info "$lib" \
              >> out/kdk-libs/arch.txt 2>&1 || true
          done

          ls -la out/kdk-libs

      - name: Collect kernel
        if: always()
        shell: bash
        run: |
          mkdir -p out

          cp -R dxb/fakeroot/System/Library/Kernels/. out/ 2>/dev/null || true

          ls -la out

          (cd out && shasum -a 256 kernel.* > SHA256SUMS) || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: xnu-kernel
          path: out/
          if-no-files-found: warn
